# Theme cố định cho dashboard CommerceFlow 360 (chạy `streamlit run app/Home.py` từ thư mục gốc repo).
# Khóa base = "light" để giao diện giống nhau dù Windows/trình duyệt đang ở chế độ tối.
[theme]
base = "light"
primaryColor = "#1f5eea"
backgroundColor = "#f3f7ff"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f2350"
borderColor = "#dfe8f8"
baseRadius = "0.8rem"
chartCategoricalColors = ["#1f5eea", "#f5a524", "#16a34a", "#ef5d4e", "#64748b"]

[theme.sidebar]
backgroundColor = "#0b2a6b"
secondaryBackgroundColor = "#143a8a"
textColor = "#e6efff"
primaryColor = "#ffc857"
borderColor = "#24468f"

[browser]
gatherUsageStats = false
